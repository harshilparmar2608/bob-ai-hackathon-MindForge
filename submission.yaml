submission:
  title: "CampusPilot – Your AI Academic & Career Copilot"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    CampusPilot solves the problem of **students struggling to manage scattered academic tasks, deadlines, exams, and career preparation across multiple platforms**, often leading to missed deadlines and inefficient planning. This problem is experienced primarily by **students**, while faculty mentors, academic advisors, and placement cells also face challenges in tracking and supporting student progress.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    CampusPilot works as a **central AI decision layer** that collects and organizes a student’s academic and career data from different sources, including assignments, exams, notes, deadlines, skills, and placement activities. Using **NLP, predictive analytics, recommendation systems, and RAG**, it analyzes the student’s workload, performance, and goals to prioritize tasks, generate personalized study plans, predict academic risks, and recommend relevant career opportunities. Every recommendation is accompanied by an **explainable reason**, so students understand not only *what* to do, but *why* it matters.


  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Feature 1: AI Study Copilot — Generates personalized daily study plans, prioritizes assignments and exams, and creates revision schedules based on deadlines and performance."                               # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
    - "Feature 2: Academic Risk Prediction — Identifies students at risk of poor performance or missed deadlines and recommends targeted improvement actions."
    - "Feature 3: Career Copilot — Provides placement-readiness scores, analyzes resume skill gaps, and recommends relevant skills, internships, and hackathons."
    - "Feature 4: Smart Productivity Assistant — AI-powered task prioritization, reminders, daily goals, and weekly progress reports."                               # optional 4th
    - "Feature 5: RAG-Based Academic Assistant — Answers questions from uploaded notes, syllabi, and study materials using Retrieval-Augmented Generation, with explainable recommendations."                               # optional 5th

  tech_stack:
    languages: ["TypeScript", "Python"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["React", "FastAPI", "Tailwind CSS"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM Granite", "watsonx.ai"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["SQLite", "PostgreSQL Ready"]                      # e.g., ["PostgreSQL", "Redis"]
    other: ["Docker", "JWT", "Google OAuth"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    CampusPilot is more than a student dashboard—it's an intelligent academic companion that combines modern UI, secure authentication, personalized analytics, and IBM Granite AI into one seamless platform. We transformed scattered academic workflows into a unified, AI-driven experience where every recommendation is tailored to the authenticated student. Our focus on user experience, scalable architecture, and meaningful AI assistance makes CampusPilot a practical solution for improving student productivity and success.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    - Google OAuth setup requires production credentials.
    - External LMS integrations are planned for future releases.
    - AI recommendations improve as more academic data becomes available.
    - SQLite is used for local development (PostgreSQL recommended for production).

