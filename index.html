<html lang="en" class="h-full preload">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="AI-powered Student Success Copilot built on IBM Carbon Design System principles, empowering students to manage academics, assignments, attendance, study planning, notes, and career preparation." />
    <meta property="og:title" content="CampusPilot — AI Student Success Copilot" />
    <meta property="og:description" content="AI-powered Student Success Copilot built on IBM Carbon Design System principles." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CampusPilot" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CampusPilot — AI Student Success Copilot" />
    <meta name="twitter:description" content="AI-powered Student Success Copilot built on IBM Carbon Design System principles." />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:image:alt" content="CampusPilot logo — AI Student Success Copilot" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="application-name" content="CampusPilot" />
    <meta name="apple-mobile-web-app-title" content="CampusPilot" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12161f" media="(prefers-color-scheme: dark)" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var key = 'campuspilot_theme_mode';
          var stored = localStorage.getItem(key);
          var isDark = false;
          if (stored === 'dark') {
            isDark = true;
          } else if (stored === 'light') {
            isDark = false;
          } else {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full antialiased font-sans bg-[#f4f5f7] dark:bg-[#12161f] text-gray-900 dark:text-gray-100 selection:bg-blue-600 selection:text-white">
    <div id="root" class="h-full"></div>
    <div
      id="app-splash"
      style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#f4f5f7;transition:opacity 0.32s ease;"
    >
      <span style="display:inline-flex;align-items:center;justify-content:center;width:96px;height:96px;border-radius:24px;background:#ffffff;box-shadow:0 10px 30px rgba(37,99,235,0.18), 0 1px 3px rgba(15,23,42,0.12);">
        <img
          src="/logo-mark-256.png"
          alt="CampusPilot"
          width="72"
          height="72"
          style="width:72px;height:72px;object-fit:contain;"
          decoding="async"
          fetchpriority="high"
        />
      </span>
      <div style="font-family:'IBM Plex Sans',system-ui,sans-serif;font-weight:700;font-size:15px;letter-spacing:0.01em;color:#111827;">
        CampusPilot
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="width:6px;height:6px;border-radius:9999px;background:#2563eb;animation:splash-pulse 1s ease-in-out infinite;"></span>
        <span style="width:6px;height:6px;border-radius:9999px;background:#2563eb;animation:splash-pulse 1s ease-in-out 0.15s infinite;"></span>
        <span style="width:6px;height:6px;border-radius:9999px;background:#2563eb;animation:splash-pulse 1s ease-in-out 0.3s infinite;"></span>
      </div>
      <style>
        @keyframes splash-pulse {
          0%, 100% { opacity: 0.25; transform: scale(0.85); }
          50% { opacity: 1; transform: scale(1.1); }
        }
        @media (prefers-color-scheme: dark) {
          #app-splash { background: #12161f !important; }
          #app-splash > div:nth-child(2) { color: #f9fafb !important; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove the brand splash as soon as React renders into #root (with a safety timeout).
      (function () {
        try {
          var splash = document.getElementById("app-splash");
          if (!splash) return;
          var done = false;
          function hide() {
            if (done) return;
            done = true;
            splash.style.opacity = "0";
            setTimeout(function () {
              if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
            }, 340);
          }
          var root = document.getElementById("root");
          if (root && window.MutationObserver) {
            var obs = new MutationObserver(function () {
              if (root.children.length > 0) {
                obs.disconnect();
                hide();
              }
            });
            obs.observe(root, { childList: true });
          }
          setTimeout(hide, 5000);
        } catch (e) {}
      })();
    </script>
    <script>
      // Remove preload class right after initial paint to re-enable smooth color transitions
      window.addEventListener('DOMContentLoaded', function() {
        requestAnimationFrame(function() {
          setTimeout(function() {
            document.documentElement.classList.remove('preload');
          }, 60);
        });
      });
    </script>
  </body>
</html>
