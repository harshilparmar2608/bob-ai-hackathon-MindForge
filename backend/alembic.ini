# Alembic configuration for CampusPilot
# https://alembic.sqlalchemy.org/

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Overridden at runtime from app settings / DATABASE_URL in env.py
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# hooks = ruff
# [post_write_hooks.ruff]
# type = console_scripts
# entrypoint = ruff
# options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
